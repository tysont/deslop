[project]
name = "deslop"
version = "0.1.0"
description = "Voice calibration, scoring, and conversion for prose"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "spacy>=3.7",
    "rich>=13",
    "simhash>=2.1",
    "trafilatura>=1.9",
    "httpx>=0.27",
    "pyyaml>=6",
    "anthropic>=0.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "en-core-web-sm",
    "pypdf>=6.21.4",
]

[project.scripts]
deslop = "deslop.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deslop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

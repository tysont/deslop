# ABOUTME: Model prices in USD per million tokens, used to estimate conversion and export cost.
# ABOUTME: Copy to ~/.deslop/pricing.yaml (or $DESLOP_HOME/pricing.yaml) to add or override models.
fetched: 2026-10-31
sources:
  anthropic: https://platform.claude.com/docs/en/about-claude/pricing
  openai: https://developers.openai.com/api/docs/pricing
# Base (non-batch, non-cached) rates. The longest matching model-name prefix wins.
models:
  claude-fable-5-1: {input: 10.0, output: 50.0}
  claude-fable-5: {input: 10.0, output: 50.0}
  claude-opus-5-5: {input: 4.0, output: 20.0}
  claude-opus-5: {input: 5.0, output: 25.0}
  claude-opus-4-8: {input: 5.0, output: 25.0}
  claude-opus-4-7: {input: 5.0, output: 25.0}
  claude-opus-4-6: {input: 5.0, output: 25.0}
  claude-opus-4-5: {input: 5.0, output: 25.0}
  claude-sonnet-5-5: {input: 2.0, output: 10.0}
  claude-sonnet-5: {input: 2.0, output: 10.0}
  claude-sonnet-4-6: {input: 3.0, output: 15.0}
  claude-sonnet-4-5: {input: 3.0, output: 15.0}
  claude-haiku-5-5: {input: 0.1, output: 0.5}  # prompts up to 100k tokens
  claude-haiku-4-5: {input: 1.0, output: 5.0}
  gpt-5.5-pro: {input: 30.0, output: 180.0}
  gpt-5.5: {input: 5.0, output: 30.0}
  gpt-5.4-pro: {input: 30.0, output: 180.0}
  gpt-5.4-mini: {input: 0.75, output: 4.5}
  gpt-5.4-nano: {input: 0.2, output: 1.25}
  gpt-5.4: {input: 2.5, output: 15.0}
  gpt-5.2-pro: {input: 21.0, output: 168.0}
  gpt-5.2: {input: 1.75, output: 14.0}
  gpt-5.1: {input: 1.25, output: 10.0}
  gpt-5-pro: {input: 15.0, output: 120.0}
  gpt-5-mini: {input: 0.25, output: 2.0}
  gpt-5-nano: {input: 0.05, output: 0.4}
  gpt-5: {input: 1.25, output: 10.0}
  gpt-4.1-mini: {input: 0.4, output: 1.6}
  gpt-4.1-nano: {input: 0.1, output: 0.4}
  gpt-4.1: {input: 2.0, output: 8.0}
  gpt-4o-mini: {input: 0.15, output: 0.6}
  gpt-4o: {input: 2.5, output: 10.0}
  o3: {input: 2.0, output: 8.0}
  o4-mini: {input: 1.1, output: 4.4}
# Fine-tuning: training cost per million tokens (OpenAI fine-tuning section of the same page).
training:
  gpt-4.1: 25.0
  gpt-4.1-mini: 5.0
  gpt-4.1-nano: 1.5
  gpt-4o: 25.0
  gpt-4o-mini: 3.0
